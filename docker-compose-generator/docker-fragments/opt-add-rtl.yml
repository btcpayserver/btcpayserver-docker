required-routes:
  - "rtl"
services:
  bitcoin_rtl:
    image: shahanafarooqui/rtl:v0.15.12
    restart: unless-stopped
    environment:
      RTL_CONFIG_PATH: /data/
      RTL_SSO: 1
      RTL_COOKIE_PATH: /data/.cookie
      LOGOUT_REDIRECT_LINK: /server/services
    volumes:
      - "bitcoin_rtl_datadir:/data"
    expose:
      - "3000"

  btcpayserver:
    environment:
      BTCPAY_BTCEXTERNALRTL: "server=/rtl/api/authenticate/cookie;cookiefile=/etc/bitcoin_rtl/.cookie"
    volumes:
      - "bitcoin_rtl_datadir:/etc/bitcoin_rtl"

volumes:
  bitcoin_rtl_datadir:
