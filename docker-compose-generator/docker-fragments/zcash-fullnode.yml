services:
  zkool_graphql:
    restart: unless-stopped
    init: true
    image: hhanh00/zkool-graphql:6.37.0
    depends_on:
      - lightwalletd
    command:
      - --db-path
      - /data/zec-graphql.db
      - --coin
      - "0"
      - --lwd-url
      - http://lightwalletd:9067
      - --bind-address
      - 0.0.0.0
      - --port
      - "8000"
      # The current BTCPay client does not send JWT credentials.
      # Keep this service on the private Compose network without published ports.
      - --allow-unauthenticated
      - --allow-unencrypted-database
    environment:
      HOME: /data
    expose:
      - "8000"
    volumes:
      - zec_graphql_wallet:/data

  btcpayserver:
    environment:
      BTCPAY_ZEC_WALLET_BACKEND_TYPE: ZkoolGraphQL
      BTCPAY_ZEC_WALLET_GRAPHQL_URI: http://zkool_graphql:8000/graphql

  zebra:
    container_name: zebra
    image: zfnd/zebra:7.1.0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "4"
          memory: 16G
    volumes:
      - zebrad-cache:/home/zebra/.cache/zebra
    tty: true
    environment:
      - ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:8232
      - ZEBRA_RPC__ENABLE_COOKIE_AUTH=false
    expose:
      - "8232"

  lightwalletd:
    image: electriccoinco/lightwalletd:v0.6.3
    platform: linux/amd64
    depends_on:
      zebra:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "4"
          memory: 16G
    environment:
      - LWD_GRPC_PORT=9067
      - LWD_HTTP_PORT=9068
    configs:
      - source: lwd_config
        target: /etc/lightwalletd/zcash.conf
    volumes:
      - lwd-cache:/var/lib/lightwalletd/db
    #! This setup with `--no-tls-very-insecure` is only for testing purposes.
    #! For production environments, follow the guidelines here:
    #! https://github.com/zcash/lightwalletd#production-usage
    command: >
      --no-tls-very-insecure
      --grpc-bind-addr=0.0.0.0:9067
      --http-bind-addr=0.0.0.0:9068
      --zcash-conf-path=/etc/lightwalletd/zcash.conf
      --data-dir=/var/lib/lightwalletd/db
      --log-file=/dev/stdout
      --log-level=7
    expose:
      - "9067" # gRPC
      - "9068" # HTTP

configs:
  lwd_config:
    file: ./zcash.conf

volumes:
  zec_graphql_wallet:
  zebrad-cache:
    driver: local

  lwd-cache:
    driver: local

exclusive:
  - zcash-node
