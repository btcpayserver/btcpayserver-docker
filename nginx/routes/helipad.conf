location /helipad/ {
	set $btcpay_route_upstream helipad;
	rewrite ^/helipad/(.*)$ /$1 break;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Host $host:443;
	proxy_set_header X-Forwarded-Server $host;
	proxy_set_header X-Forwarded-Port 443;
	proxy_set_header X-Forwarded-Proto https;
	sub_filter_once off;
	sub_filter_types *;
	sub_filter 'src="/' 'src="/helipad/';
	sub_filter 'href="/' 'href="/helipad/';
	sub_filter '/image' '/helipad/image';
	sub_filter '/pew' '/helipad/pew';
	sub_filter '/boosts' '/helipad/boosts';
	sub_filter '/api/v1/helipad' '/helipad/api/v1/helipad';
	proxy_pass http://$btcpay_route_upstream:2112;
	proxy_redirect ~^http://helipad:2112/?(.*)$ /helipad/$1;
}
