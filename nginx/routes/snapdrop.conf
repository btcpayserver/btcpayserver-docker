location /snapdrop/ {
	set $btcpay_route_upstream snapdrop;
	rewrite ^/snapdrop/(.*)$ /$1 break;
	proxy_connect_timeout 300;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Host $host:443;
	proxy_set_header X-Forwarded-Server $host;
	proxy_set_header X-Forwarded-Port 443;
	proxy_set_header X-Forwarded-Proto https;
	proxy_pass http://$btcpay_route_upstream:8080;
	proxy_redirect ~^http://snapdrop:8080/?(.*)$ /snapdrop/$1;
}
location /snapdrop/server {
	set $btcpay_route_upstream snapdrop;
	rewrite ^/snapdrop/server(.*)$ /server$1 break;
	proxy_connect_timeout 300;
	proxy_pass http://$btcpay_route_upstream:8080;
	proxy_redirect ~^http://snapdrop:8080/server(.*)$ /snapdrop/server$1;
	proxy_set_header Connection "upgrade";
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header X-Forwarded-for $remote_addr;
}
