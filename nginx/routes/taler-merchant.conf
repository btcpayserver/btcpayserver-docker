location ~ ^/taler-merchant/(private|webui|management|instances/[^/]+/private)(/|$) {
	return 403;
}
location /taler-merchant/ {
	set $btcpay_route_upstream taler-merchant;
	rewrite ^/taler-merchant/(.*)$ /$1 break;
	proxy_pass http://$btcpay_route_upstream:9966;
	proxy_redirect ~^http://taler-merchant:9966/?(.*)$ /taler-merchant/$1;
}
