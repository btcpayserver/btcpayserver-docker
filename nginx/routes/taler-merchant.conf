location ~ ^/taler-merchant/(private|webui|management|instances/[^/]+/private)(/|$) {
	return 403;
}
location /taler-merchant/ {
	set $btcpay_route_upstream taler-merchant;
	rewrite ^/taler-merchant/(.*)$ /$1 break;
	proxy_pass http://$btcpay_route_upstream:9966;
	proxy_redirect ~^http://taler-merchant:9966/?(.*)$ /taler-merchant/$1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_x_forwarded_for;
	proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
	proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
	proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
	proxy_set_header X-Forwarded-Ssl $proxy_x_forwarded_ssl;
}
